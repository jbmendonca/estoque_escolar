services:
  db:
    image: postgres:16-alpine
    container_name: estoque_escolar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque_escolar
    ports:
      - '5432:5432'
    volumes:
      - estoque_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estoque -d estoque_escolar']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  estoque_pgdata:
